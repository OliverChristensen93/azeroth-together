[package]
name = "together-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Azeroth Together's co-op wire: the TCP and invite-code threads that carry each game's messages between a host and its clients"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
# Invite codes: QUIC connections dialed by an endpoint's key, through home routers (hole punching,
# with n0's public relays as the fallback), so nobody forwards a port.
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time", "sync"] }
