[package]
name = "azeroth-together"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Azeroth Together: a co-op survivors game on the benilla WoW 1.12.1 client engine"

[lints]
workspace = true

[features]
default = ["dev"]
dev = ["benilla-app/dev"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "azeroth-together"
path = "src/main.rs"
test = false
